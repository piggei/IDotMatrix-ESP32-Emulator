[platformio]
default_envs = waveshare_s3_rgbmatrix_64x64

[env]
framework = arduino
monitor_speed = 115200
monitor_filters =
    time
    esp32_exception_decoder

; Default stack for existing non-Waveshare profiles: Arduino-ESP32 3.3.11 /
; ESP-IDF 5.5.5 via pioarduino. The Waveshare bring-up environment overrides
; this with the WLED-qualified Tasmota Arduino 3.3.8 / ESP-IDF 5.5.4 stack.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

lib_deps =
    fastled/FastLED @ 3.10.3
    bitbank2/AnimatedGIF @ 2.2.3
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7

[env:waveshare_s3_rgbmatrix_64x64]
; Waveshare ESP32-S3-RGB-Matrix / ESP32-S3-N32R16 bring-up target.
; Build 192 deliberately aligns the board/toolchain/partition baseline with the
; WLED Waveshare environment already qualified on this hardware. This removes
; two unnecessary variables from the failed B191 standalone bring-up.
board = esp32s3camlcd
board_build.arduino.memory_type = opi_opi

; Match the WLED 0.17 development Waveshare baseline: Tasmota Arduino core
; 3.3.8 / ESP-IDF 5.5.4. B191 used pioarduino Arduino 3.3.11, which was not
; hardware-qualified for this board/HUB75 combination.
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
platform_packages =

lib_deps =
    fastled/FastLED @ 3.10.3
    bitbank2/AnimatedGIF @ 2.2.3
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7
    h2zero/NimBLE-Arduino @ 2.5.1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISPLAY_BACKEND=DISPLAY_BACKEND_HUB75
    -DIDOTMATRIX_SCREEN_TYPE=4
    -DPHYSICAL_MATRIX_WIDTH=64
    -DPHYSICAL_MATRIX_HEIGHT=64
    -DNO_GFX
    -DNO_CIE1931
    -DS3_LCD_DIV_NUM=20
    -DBOARD_HAS_PSRAM
    -DIDOTMATRIX_BOARD_WAVESHARE_S3_RGB_MATRIX=1
    -DIDOTMATRIX_USE_NIMBLE=1
    -DWAVESHARE_S3_PINOUT
    -DIDOTMATRIX_DEFAULT_OTA_ENABLED=1
    -DIDOTMATRIX_DEFAULT_OTA_TRIGGER_PIN=0
    -DIDOTMATRIX_DEFAULT_OTA_TRIGGER_ACTIVE_LOW=1

; Keep the WLED-qualified 32 MB layout geometry. In particular, ota_1 stays at
; 0x310000 and the filesystem stays at 0x610000. B191 moved both boundaries,
; which made an in-place transition from the existing WLED Waveshare image an
; unnecessary migration hazard.
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions/idotmatrix_waveshare_s3_32mb_ota.csv
board_build.filesystem = littlefs
; esp32s3camlcd uses OPI boot with DOUT flash access for Arduino builds. Do not
; force board_build.flash_mode=opi; the board definition/toolchain handles the
; OPI boot mode from memory_type=opi_opi.
board_build.flash_mode = dout
board_build.f_flash = 80000000L
upload_speed = 921600


[env:matrixportal_s3_hub75_64]
board = adafruit_matrixportal_esp32s3

; MatrixPortal S3 adds the on-board LIS3DH orientation sensor. The dependency
; and profile fallback are local to this target. IDotMatrixUserConfig.h may
; override the backend/address/mount without editing this file. Automatic
; rotation is enabled whenever the resolved configuration selects a backend.
lib_deps =
    fastled/FastLED @ 3.10.3
    bitbank2/AnimatedGIF @ 2.2.3
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7
    adafruit/Adafruit LIS3DH @ 1.3.0

; Keep the display/protocol profile visible in the build environment. The same
; source still has matching defaults so Arduino IDE builds remain supported.
build_flags =
    -DDISPLAY_BACKEND=DISPLAY_BACKEND_HUB75
    -DIDOTMATRIX_SCREEN_TYPE=4
    -DPHYSICAL_MATRIX_WIDTH=64
    -DPHYSICAL_MATRIX_HEIGHT=64
    -DNO_GFX
    -DNO_CIE1931
    -DS3_LCD_DIV_NUM=20
    -DBOARD_HAS_PSRAM
    -DIDOTMATRIX_DEFAULT_ACCEL_DRIVER_LIS3DH
    -DIDOTMATRIX_DEFAULT_ACCEL_I2C_ADDRESS=0x19
    -DIDOTMATRIX_DEFAULT_ACCEL_MOUNT_ROTATION=0
    -DIDOTMATRIX_ORIENTATION_AUTO_ROTATE=1

; MatrixPortal S3 has 8 MB flash. The custom partition table reserves the
; Adafruit TinyUF2 region and provides a SPIFFS-subtype data partition used by
; Arduino LittleFS. This avoids the FAT-only default that makes GIF storage
; unavailable to the emulator.
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/idotmatrix_matrixportal_s3_8mb.csv
board_build.filesystem = littlefs

; The board definition supplies the MatrixPortal S3 variant, USB settings and
; BOARD_HAS_PSRAM for its 2 MB PSRAM.
upload_speed = 460800


[env:matrixportal_s3_hub75_64_icm20689]
board = adafruit_matrixportal_esp32s3

; External ICM-20689 profile for MatrixPortal. The ICM-20689 backend itself
; is hardware-qualified on ESP32-C3 with a shared I2C bus, while this specific
; MatrixPortal + external-ICM combination has not been separately qualified.
; The on-board LIS3DH remains physically present but is intentionally not
; selected unless a local user config overrides the fallback.
lib_deps =
    fastled/FastLED @ 3.10.3
    bitbank2/AnimatedGIF @ 2.2.3
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7

build_flags =
    -DDISPLAY_BACKEND=DISPLAY_BACKEND_HUB75
    -DIDOTMATRIX_SCREEN_TYPE=4
    -DPHYSICAL_MATRIX_WIDTH=64
    -DPHYSICAL_MATRIX_HEIGHT=64
    -DNO_GFX
    -DNO_CIE1931
    -DS3_LCD_DIV_NUM=20
    -DBOARD_HAS_PSRAM
    -DIDOTMATRIX_DEFAULT_ACCEL_DRIVER_ICM20689
    -DIDOTMATRIX_DEFAULT_ACCEL_I2C_ADDRESS=0
    -DIDOTMATRIX_DEFAULT_ACCEL_MOUNT_ROTATION=0
    -DIDOTMATRIX_ORIENTATION_AUTO_ROTATE=1

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions/idotmatrix_matrixportal_s3_8mb.csv
board_build.filesystem = littlefs
upload_speed = 460800

[env:ios_compat_esp32_ws2812_32]
board = esp32dev

; Dedicated iOS compatibility/RCSP stimulus probe for classic ESP32
; hardware: 16x16 WS2812 physical matrix on GPIO17 while exposing the logical
; 32x32 iDotMatrix profile to the official app.
build_flags =
    -DDISPLAY_BACKEND=DISPLAY_BACKEND_WS2812
    -DIDOTMATRIX_SCREEN_TYPE=3
    -DPHYSICAL_MATRIX_WIDTH=16
    -DPHYSICAL_MATRIX_HEIGHT=16
    -DMATRIX_PIN=17
    -DIOS_HANDSHAKE_EXPERIMENT=1

; Uses the ~1.875 MB LittleFS capacity validated on the classic ESP32 profile.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
upload_speed = 460800


[env:esp32c3_ws2812_16]
board = esp32-c3-devkitm-1

; WS2812-only target: do NOT include ESP32-HUB75-MatrixPanel-DMA here.
; Otherwise PlatformIO tries to compile the HUB75 library and pulls in
; Adafruit_GFX even though this environment does not use HUB75.
lib_deps =
    fastled/FastLED @ 3.10.3
    bitbank2/AnimatedGIF @ 2.2.3

; ESP32-C3 + native 16x16 WS2812 iDotMatrix profile.
; The ESP32-C3 reference hardware uses a passive low-level-trigger buzzer module on GPIO3 and a DS3231
; RTC on the shared I2C bus (SDA=GPIO1, SCL=GPIO2). The same bus may also
; carry the gesture sensor and ICM-20689; Wire is initialized only once.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISPLAY_BACKEND=DISPLAY_BACKEND_WS2812
    -DIDOTMATRIX_SCREEN_TYPE=1
    -DPHYSICAL_MATRIX_WIDTH=16
    -DPHYSICAL_MATRIX_HEIGHT=16
    -DMATRIX_PIN=4
    -DIDOTMATRIX_DEFAULT_I2C_SDA_PIN=1
    -DIDOTMATRIX_DEFAULT_I2C_SCL_PIN=2
    -DIDOTMATRIX_DEFAULT_RTC_TYPE=1
    -DIDOTMATRIX_DEFAULT_RTC_I2C_ADDRESS=0x68
    -DIDOTMATRIX_DEFAULT_RTC_SYNC_FROM_BLE=1
    -DIDOTMATRIX_DEFAULT_RTC_RETRY_INTERVAL_MS=60000UL
    -DIDOTMATRIX_DEFAULT_BUZZER_TYPE=2
    -DIDOTMATRIX_DEFAULT_BUZZER_PIN=3
    -DIDOTMATRIX_DEFAULT_BUZZER_FREQUENCY_HZ=2000
    -DIDOTMATRIX_DEFAULT_BUZZER_PASSIVE_TRIGGER_LOW=1
    -DIDOTMATRIX_DEFAULT_ALARM_BUZZER_ENABLED=1
    -DIDOTMATRIX_DEFAULT_COUNTDOWN_BUZZER_ENABLED=1
    -DIDOTMATRIX_DEFAULT_SCHEDULE_BUZZER_ENABLED=1
    -DIDOTMATRIX_DEFAULT_CONNECTION_BUZZER_ENABLED=1

board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

upload_speed = 460800
